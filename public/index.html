<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TaskBot</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f7f5;--bg3:#f0efeb;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#999;
  --border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);
  --red:#e24b4a;--red-bg:#fcebeb;--red-text:#a32d2d;
  --amber:#ef9f27;--amber-bg:#faeeda;--amber-text:#854f0b;
  --blue:#378add;--blue-bg:#e6f1fb;--blue-text:#185fa5;
  --green:#639922;--green-bg:#eaf3de;--green-text:#3b6d11;
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;
    --text:#f0ede8;--text2:#9a9890;--text3:#666;
    --border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.18);
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg2);color:var(--text);font-size:14px;line-height:1.5}
.app{max-width:860px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:100vh}
@media(max-width:600px){.app{grid-template-columns:1fr;padding:10px}}
.panel{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column}
.ph{padding:11px 14px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:8px}
.ph h2{font-size:13px;font-weight:500;flex:1}
.tabs{display:flex;border-bottom:0.5px solid var(--border)}
.tab{flex:1;padding:8px 4px;font-size:11px;font-weight:500;text-align:center;cursor:pointer;color:var(--text2);border:none;background:none;border-bottom:2px solid transparent}
.tab.on{color:var(--text);border-bottom-color:var(--red)}
.tc{display:none;flex-direction:column;flex:1;overflow:hidden}
.tc.on{display:flex}
.fa{padding:12px 14px;overflow-y:auto;flex:1}
label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;margin-top:10px}
label:first-child{margin-top:0}
input,textarea,select{width:100%;padding:7px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg2);color:var(--text);font-family:inherit;font-size:12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
textarea{height:54px;resize:none}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn{width:100%;margin-top:12px;padding:8px;font-size:12px;font-weight:500;border-radius:var(--radius);border:none;background:var(--red);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.sbtn:hover{background:var(--red-text)}
.sbtn:disabled{background:var(--border);color:var(--text3);cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;margin-top:7px}
.pill.ok{background:var(--green-bg);color:var(--green-text)}
.pill.warn{background:var(--amber-bg);color:var(--amber-text)}
.pill.full{background:var(--red-bg);color:var(--red-text)}
.errmsg{margin:7px 0 0;padding:7px 9px;background:var(--red-bg);border-radius:var(--radius);font-size:11px;color:var(--red-text);line-height:1.5;display:none}
.scroll{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:9px 11px}
.card.urgent{border-left:3px solid var(--red)}
.card.high{border-left:3px solid var(--amber)}
.card.normal{border-left:3px solid var(--blue)}
.card.resolved{opacity:.42;border-left:3px solid var(--green)}
.ctop{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:3px}
.ctitle{font-size:12px;font-weight:500}
.cmeta{font-size:10px;color:var(--text3);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.cact{display:flex;gap:5px;margin-top:5px}
.badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;flex-shrink:0}
.bd{background:var(--red-bg);color:var(--red-text)}
.bw{background:var(--amber-bg);color:var(--amber-text)}
.bi{background:var(--blue-bg);color:var(--blue-text)}
.bg{background:var(--green-bg);color:var(--green-text)}
.btn{font-size:11px;padding:3px 9px;border-radius:var(--radius);cursor:pointer;font-weight:500;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2)}
.btn:hover{background:var(--bg3)}
.btn.primary{border-color:var(--green);background:var(--green-bg);color:var(--green-text)}
.btn.primary:hover{background:#c0dd97}
.btn.blue{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-text)}
.empty{text-align:center;padding:28px 14px;color:var(--text3);font-size:12px}
.fbar{padding:7px 10px;border-bottom:0.5px solid var(--border);display:flex;gap:5px}
.qt{display:flex;gap:4px;margin-top:5px}
.qs{flex:1;height:5px;border-radius:3px;background:var(--bg3);border:0.5px solid var(--border)}
.qs.t{background:var(--red)}
.qs.q{background:var(--blue)}
.pin-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;padding:32px}
.pin-wrap p{font-size:12px;color:var(--text2);text-align:center}
.pin-wrap input{width:140px;font-size:20px;letter-spacing:8px;text-align:center;padding:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;white-space:nowrap}
.toast.show{opacity:1}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">

  <!-- ══ LEFT — команда ══ -->
  <div class="panel">
    <div class="ph">
      <span style="font-size:14px">✈</span>
      <h2>Отправить задачу</h2>
      <button class="btn blue" onclick="showMgr()" style="padding:2px 8px;font-size:10px">Я управленец</button>
    </div>
    <div class="tabs">
      <button class="tab on" onclick="swT('create')">Новое</button>
      <button class="tab" onclick="swT('history')">История</button>
      <button class="tab" onclick="swT('quota')">Квоты</button>
    </div>

    <!-- CREATE -->
    <div class="tc on" id="tc-create">
      <div class="fa">
        <label>Сотрудник</label>
        <select id="fAuthor" onchange="onAuthor()">
          <option value="">— выберите себя —</option>
        </select>
        <div id="qwrap" style="display:none">
          <div id="qpill" class="pill ok"></div>
          <div id="errmsg" class="errmsg"></div>
        </div>
        <label>Тип</label>
        <select id="fType" onchange="onType()">
          <option value="task">🔴 Задача / Проблема</option>
          <option value="question">🔵 Вопрос</option>
        </select>
        <label>Заголовок</label>
        <input id="fTitle" placeholder="Кратко..." maxlength="80"/>
        <label>Подробнее</label>
        <textarea id="fDesc" placeholder="Детали, контекст..."></textarea>
        <div id="taskExtra">
          <div class="r2">
            <div><label>Приоритет</label>
              <select id="fPrio"><option value="urgent">🔴 Критично</option><option value="high">🟠 Высокий</option><option value="normal">🔵 Обычный</option></select>
            </div>
            <div><label>Дедлайн</label><input type="datetime-local" id="fDL"/></div>
          </div>
        </div>
        <button class="sbtn" id="sbtn" onclick="submitTask()">✈ Отправить</button>
      </div>
    </div>

    <!-- HISTORY -->
    <div class="tc" id="tc-history">
      <div class="fbar">
        <button class="btn primary" id="tf-open" onclick="setTF('open')" style="padding:2px 7px">Открытые</button>
        <button class="btn" id="tf-all" onclick="setTF('all')" style="padding:2px 7px">Все</button>
        <button class="btn" id="tf-done" onclick="setTF('done')" style="padding:2px 7px">Решённые</button>
      </div>
      <div class="scroll" id="teamList"><div class="empty">⏳ Загрузка...</div></div>
    </div>

    <!-- QUOTA -->
    <div class="tc" id="tc-quota">
      <div style="padding:10px 14px;flex:1;overflow-y:auto">
        <div style="font-size:11px;color:var(--text2);margin-bottom:8px">Лимит: <strong>3 обращения</strong> в день на сотрудника.</div>
        <div style="display:flex;gap:10px;font-size:10px;color:var(--text3);margin-bottom:10px">
          <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);vertical-align:-1px;margin-right:2px"></span>задача</span>
          <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--blue);vertical-align:-1px;margin-right:2px"></span>вопрос</span>
          <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bg3);border:0.5px solid var(--border);vertical-align:-1px;margin-right:2px"></span>свободно</span>
        </div>
        <div id="quotaTable"><div class="empty">⏳ Загрузка...</div></div>
      </div>
    </div>
  </div>

  <!-- ══ RIGHT — управленец ══ -->
  <div class="panel">

    <!-- PIN -->
    <div class="tc on" id="tc-pin">
      <div class="ph"><h2 style="color:var(--blue-text)">🔐 Вход для управленца</h2></div>
      <div class="pin-wrap">
        <p>Введите PIN-код</p>
        <input type="password" id="pinInput" maxlength="4" placeholder="••••" oninput="checkPin()"/>
        <div style="font-size:11px;color:var(--red-text);display:none" id="pinErr">Неверный PIN</div>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div class="tc" id="tc-dash">
      <div class="ph">
        <span style="font-size:14px">📋</span>
        <h2>Задачи команды</h2>
        <span class="badge bd" id="openCount">0</span>
        <button class="btn" onclick="logout()" style="padding:2px 8px;font-size:10px;margin-left:4px">Выйти</button>
      </div>
      <div class="fbar">
        <button class="btn primary" id="mf-open" onclick="setMF('open')" style="padding:2px 7px">Открытые</button>
        <button class="btn" id="mf-all" onclick="setMF('all')" style="padding:2px 7px">Все</button>
        <button class="btn" id="mf-done" onclick="setMF('done')" style="padding:2px 7px">Архив</button>
      </div>
      <div class="scroll" id="mgrList"><div class="empty">⏳ Загрузка...</div></div>
    </div>

  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let tFilter='open', mFilter='open', quotas=[];

async function api(path, opts={}) {
  const r = await fetch(path, { headers:{'Content-Type':'application/json'}, ...opts });
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}

async function init() {
  try {
    const emps = await api('/api/employees');
    const sel = document.getElementById('fAuthor');
    emps.forEach(e => { const o=document.createElement('option'); o.value=o.textContent=e; sel.appendChild(o); });
  } catch(e) {}
  await refreshQuotas();
  onType();
  const d=new Date(Date.now()+90*60000), p=v=>String(v).padStart(2,'0');
  document.getElementById('fDL').value=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  setInterval(()=>{ if(document.getElementById('tc-dash').classList.contains('on')) loadMgr(); }, 20000);
}

async function refreshQuotas() {
  try { quotas = await api('/api/quotas'); renderQuota(); } catch(e) {}
}

function gq(author) { return quotas.find(q=>q.author===author) || {used:0,limit:3}; }

function onAuthor() {
  const a=document.getElementById('fAuthor').value;
  const wrap=document.getElementById('qwrap'), pill=document.getElementById('qpill');
  const em=document.getElementById('errmsg'), btn=document.getElementById('sbtn');
  if (!a) { wrap.style.display='none'; btn.disabled=false; return; }
  wrap.style.display='block';
  const q=gq(a), left=q.limit-q.used;
  if (left<=0) { pill.className='pill full'; pill.textContent=`Лимит исчерпан — ${q.used}/${q.limit}`; em.style.display='block'; em.textContent=`⛔ ${a} уже отправил ${q.limit} обращения сегодня.`; btn.disabled=true; }
  else if (left===1) { pill.className='pill warn'; pill.textContent=`Осталось ${left} из ${q.limit}`; em.style.display='none'; btn.disabled=false; }
  else { pill.className='pill ok'; pill.textContent=`Осталось ${left} из ${q.limit}`; em.style.display='none'; btn.disabled=false; }
}

function onType() { document.getElementById('taskExtra').style.display = document.getElementById('fType').value==='task'?'block':'none'; }

async function submitTask() {
  const author=document.getElementById('fAuthor').value, title=document.getElementById('fTitle').value.trim(), type=document.getElementById('fType').value;
  if (!author) { document.getElementById('fAuthor').focus(); return; }
  if (!title) { document.getElementById('fTitle').focus(); return; }
  const btn=document.getElementById('sbtn'); btn.disabled=true; btn.innerHTML='<span class="spin">⏳</span> Отправка...';
  try {
    await api('/api/tasks',{method:'POST',body:JSON.stringify({title,description:document.getElementById('fDesc').value.trim(),type,priority:document.getElementById('fPrio').value,author,deadline:type==='task'?(document.getElementById('fDL').value||null):null})});
    document.getElementById('fTitle').value=''; document.getElementById('fDesc').value=''; document.getElementById('fAuthor').value='';
    onAuthor(); await refreshQuotas(); toast('✅ Отправлено — уведомления ушли в Telegram');
  } catch(e) { toast('❌ '+e.message); btn.disabled=false; }
  btn.innerHTML='✈ Отправить';
}

const PM={urgent:['bd','Критично'],high:['bw','Высокий'],normal:['bi','Обычный']};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function cardHtml(t, isMgr) {
  const [cls,lbl]=PM[t.priority]||['bi','Обычный'], isQ=t.type==='question';
  const time=new Date(t.created_at).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const dl=t.deadline?` · до ${new Date(t.deadline).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}` :'';
  return `<div class="card ${t.resolved?'resolved':isQ?'normal':t.priority}">
    <div class="ctop"><span class="ctitle">${isQ?'❓ ':''}${esc(t.title)}</span><span class="badge ${isQ?'bi':cls}">${isQ?'Вопрос':lbl}</span></div>
    ${t.description?`<div style="font-size:11px;color:var(--text2);margin-bottom:3px;line-height:1.4">${esc(t.description).slice(0,120)}${t.description.length>120?'…':''}</div>`:''}
    <div class="cmeta">
      <span>👤 ${esc(t.author)}</span>
      <span>🕐 ${time}${dl}</span>
      ${t.ping_count>0?`<span style="color:var(--amber-text)">🔔 пингов: ${t.ping_count}</span>`:''}
      ${t.resolved_by?`<span style="color:var(--green-text)">✅ ${esc(t.resolved_by)}</span>`:''}
    </div>
    ${isMgr&&!t.resolved?`<div class="cact"><button class="btn primary" onclick="resolve(${t.id})">✅ Я решил</button></div>`
     :t.resolved?`<div style="font-size:10px;color:var(--green-text);margin-top:3px">✅ Решено</div>`:''}
  </div>`;
}

async function loadTeam() {
  try { const ts=await api(`/api/tasks?filter=${tFilter}`); document.getElementById('teamList').innerHTML=ts.length?ts.map(t=>cardHtml(t,false)).join(''):'<div class="empty">Задач нет</div>'; }
  catch(e) { document.getElementById('teamList').innerHTML='<div class="empty">Ошибка загрузки</div>'; }
}

async function loadMgr() {
  try {
    const ts=await api(`/api/tasks?filter=${mFilter}`);
    document.getElementById('mgrList').innerHTML=ts.length?ts.map(t=>cardHtml(t,true)).join(''):'<div class="empty">Всё решено 🎉</div>';
    document.getElementById('openCount').textContent=ts.filter(t=>!t.resolved).length;
  } catch(e) {}
}

async function resolve(id) {
  try { await api(`/api/tasks/${id}/resolve`,{method:'PATCH',body:JSON.stringify({resolvedBy:'Управленец'})}); toast('✅ Закрыто — команда уведомлена'); loadMgr(); loadTeam(); }
  catch(e) { toast('❌ '+e.message); }
}

function renderQuota() {
  const el=document.getElementById('quotaTable');
  el.innerHTML=quotas.map(q=>{
    const left=q.limit-q.used, sc=left<=0?'bd':left===1?'bw':'bg';
    const segs=Array.from({length:q.limit},(_,i)=>`<div class="qs${i<q.used?' t':''}"></div>`).join('');
    return `<div style="background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:8px 10px;margin-bottom:5px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
        <span style="font-size:12px;font-weight:500">${q.author}</span>
        <span class="badge ${sc}">${q.used}/${q.limit}${left<=0?' · исчерпан':` · осталось ${left}`}</span>
      </div>
      <div class="qt">${segs}</div>
    </div>`;
  }).join('');
}

function swT(name) {
  ['create','history','quota'].forEach((n,i)=>{
    document.querySelectorAll('.panel:first-child .tab')[i].classList.toggle('on',n===name);
    document.getElementById('tc-'+n).classList.toggle('on',n===name);
  });
  if(name==='history') loadTeam();
  if(name==='quota')   refreshQuotas();
}

function setTF(f){tFilter=f;['open','all','done'].forEach(x=>{const e=document.getElementById('tf-'+x);e.className='btn'+(x===f?' primary':'');e.style.padding='2px 7px';});loadTeam();}
function setMF(f){mFilter=f;['open','all','done'].forEach(x=>{const e=document.getElementById('mf-'+x);e.className='btn'+(x===f?' primary':'');e.style.padding='2px 7px';});loadMgr();}

async function checkPin() {
  const v=document.getElementById('pinInput').value;
  if(v.length<4) return;
  try {
    await api('/api/auth',{method:'POST',body:JSON.stringify({pin:v})});
    document.getElementById('tc-pin').classList.remove('on');
    document.getElementById('tc-dash').classList.add('on');
    document.getElementById('pinErr').style.display='none';
    loadMgr();
  } catch { document.getElementById('pinErr').style.display='block'; document.getElementById('pinInput').value=''; }
}

function showMgr(){document.getElementById('tc-pin').classList.add('on');document.getElementById('tc-dash').classList.remove('on');setTimeout(()=>document.getElementById('pinInput').focus(),100);}
function logout(){document.getElementById('tc-dash').classList.remove('on');document.getElementById('tc-pin').classList.add('on');document.getElementById('pinInput').value='';}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);}

init();
</script>
</body>
</html>
